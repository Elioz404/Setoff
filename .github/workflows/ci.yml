name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          target: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: RUSTFLAGS="-C target-cpu=mvp -C link-arg=-s --cfg near" cargo build --release --locked --target wasm32-unknown-unknown -p setoff-clearing-house -p setoff-test-token
      - run: cargo clippy -p setoff-sandbox-tests --all-targets --locked -- -D warnings
      - run: cargo test -p setoff-sandbox-tests --locked
        env:
          SETOFF_WASM_DIR: target/wasm32-unknown-unknown/release

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @setoff/web
