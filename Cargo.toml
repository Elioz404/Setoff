[workspace]
resolver = "2"
members = ["crates/setoff-core", "contracts/clearing-house", "contracts/test-token", "contracts/sandbox-tests"]
# The sandbox tests need the built wasm and a local NEAR node, so `cargo test`
# leaves them out; CI runs them after building the contracts.
default-members = ["crates/setoff-core", "contracts/clearing-house", "contracts/test-token"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.86"

[workspace.dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"
proptest = "1"
setoff-core = { path = "crates/setoff-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
